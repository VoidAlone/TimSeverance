site_name: Tim's Big Website :D

theme:
    name: 'material'
    palette:

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: lightish
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: darkish
      toggle:
        icon: material/weather-night
        name: Switch to light mode

# Extensions
markdown_extensions:
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true

plugins:
  - search
  - roamlinks 

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
